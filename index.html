<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اللغة العربية – الصف السادس | International Education Egypt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#FBF6EC;--paper2:#F4EBD8;--card:#FFFDF8;--ink:#14213D;--ink2:#4A5272;--muted:#7B7F92;
 --navy:#0D2C83;--navy2:#0A1F5C;--gold:#F4B400;--gold2:#FFE7A3;--line:#E6DAC2;
 --ok:#1F7A4A;--okbg:#E5F4EA;--bad:#B4232C;--badbg:#FBE7E6;--warn:#9A6400;--warnbg:#FFF3D6;
 --r:14px;--shadow:0 1px 0 rgba(20,33,61,.06),0 8px 24px -14px rgba(20,33,61,.28);
 --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;--f-head:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;--f-text:"Amiri","Traditional Arabic",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75;min-height:100vh;
 background-image:radial-gradient(circle at 12% 0%,rgba(244,180,0,.10),transparent 38%),radial-gradient(circle at 100% 30%,rgba(13,44,131,.06),transparent 40%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== header ===== */
.top{position:sticky;top:0;z-index:40;background:rgba(251,246,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand img{width:56px;height:56px;object-fit:contain;flex:none}
.brand b{font-family:var(--f-head);font-size:20px;line-height:1.2;display:block;white-space:nowrap}
.brand small{display:block;color:var(--ink2);font-size:12.5px;letter-spacing:.2px;white-space:nowrap;direction:ltr;text-align:right}
.spacer{flex:1}
.pts{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px 6px 10px;font-weight:600;font-size:15px;white-space:nowrap}
.pts i{width:22px;height:22px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--ink);font-style:normal;font-size:13px}
.pts.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.15)}}
nav.main{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;scrollbar-width:none}
@media (min-width:721px) and (max-width:980px){nav.main a{padding:6px 10px;font-size:14px}nav.main a svg{display:none}}
nav.main::-webkit-scrollbar{display:none}
nav.main a{flex:none;text-decoration:none;color:var(--ink2);padding:7px 14px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;transition:.2s}
nav.main a:hover{background:var(--paper2)}
nav.main a.on{background:var(--navy);color:#fff}
@media (max-width:720px){
 .top{backdrop-filter:none;background:var(--paper)}
 .brand small{display:none}.brand b{font-size:16px}.brand img{width:44px;height:44px}
 nav.main{flex-wrap:nowrap;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50;justify-content:space-between;gap:2px}
 nav.main a{font-size:11.5px;padding:6px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.3;border-radius:10px;flex:1;text-align:center}
 nav.main a svg{display:block}
 body{padding-bottom:78px}
}
nav.main a svg{width:20px;height:20px;vertical-align:-4px;margin-left:6px}
@media (max-width:720px){nav.main a svg{margin:0 0 2px}}
main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.view{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-head);line-height:1.35;margin:0 0 .4em}
h1{font-size:clamp(26px,4.4vw,44px)}h2{font-size:clamp(21px,3vw,28px)}h3{font-size:19px}
.eyebrow{font-size:13px;letter-spacing:.5px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.muted{color:var(--muted)}
.crumbs{font-size:14px;color:var(--ink2);margin-bottom:10px}
.crumbs a{text-decoration:none;font-weight:600}
/* ===== hero ===== */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:stretch;margin-bottom:26px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero-txt{padding:10px 0}
.hero-txt p{font-size:18px;color:var(--ink2);max-width:52ch}
.hero-art{position:relative;border-radius:22px;background:var(--navy2);color:#fff;overflow:hidden;min-height:250px;padding:26px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-art .glyphs{position:absolute;inset:-20px;font-family:var(--f-text);font-size:120px;line-height:1;opacity:.13;color:var(--gold);display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-content:center;transform:rotate(-8deg)}
.hero-art .glyphs span{animation:float 7s ease-in-out infinite}
.hero-art .glyphs span:nth-child(2n){animation-delay:-3s}
@keyframes float{50%{transform:translateY(-12px)}}
.hero-art .big{position:relative;font-family:var(--f-head);font-size:52px;line-height:1.1}
.hero-art .big em{font-style:normal;color:var(--gold)}
.hero-art .sub{position:relative;opacity:.85}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.stat b{font-family:var(--f-head);font-size:24px;display:block;line-height:1.2}
.stat span{font-size:13px;color:var(--ink2)}
/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 20px;font-weight:600;background:var(--navy);color:#fff;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s;min-height:46px}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px var(--navy)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.soft{background:var(--paper2);color:var(--ink)}
.btn.sm{padding:6px 14px;min-height:38px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ===== mode cards ===== */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:10px 0 28px}
.mode{position:relative;display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.mode:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.mode .n{position:absolute;left:16px;top:6px;font-family:var(--f-head);font-size:72px;color:var(--paper2);line-height:1}
.mode h3{position:relative;font-size:22px}
.mode p{position:relative;margin:4px 0 12px;color:var(--ink2)}
.mode .go{position:relative;font-weight:700;color:var(--navy)}
.mode.a{border-top:5px solid var(--navy)}.mode.b{border-top:5px solid var(--gold)}.mode.c{border-top:5px solid #C2410C}
/* ===== week grid ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wk{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;transition:.25s}
.wk:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.wk .num{font-family:var(--f-head);font-size:40px;line-height:1;color:var(--navy)}
.wk .t{font-weight:700}
.wk ul{margin:0;padding:0 18px 0 0;font-size:14px;color:var(--ink2);line-height:1.6}
.wk .badge-done{position:absolute;left:12px;top:12px}
.bar{height:8px;background:var(--paper2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E28F00);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.navy>i{background:var(--navy)}
.unit-h{display:flex;align-items:baseline;gap:12px;margin:24px 0 12px}
.unit-h h2{margin:0}
.unit-h span{color:var(--ink2)}
/* ===== skills ===== */
.sk{--c:#333;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit;display:flex;gap:14px;align-items:flex-start;transition:.25s;border-inline-start:6px solid var(--c)}
.sk:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.sk .ic{width:46px;height:46px;flex:none;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;font-family:var(--f-head);font-size:22px}
.sk b{font-family:var(--f-head);font-size:20px;display:block}
.sk span{font-size:14px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.chip.c{background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:inherit;transition:.2s}
.lesson:hover{border-color:var(--navy);transform:translateX(-3px)}
.lesson .lt{flex:1;min-width:0}
.lesson .lt b{display:block}
.lesson .lt span{font-size:14px;color:var(--ink2)}
.lesson .ring{flex:none}
/* ===== session ===== */
.sess-head{position:sticky;top:110px;z-index:30;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
@media (max-width:720px){.sess-head{position:static}}
.sess-head h2{font-size:clamp(18px,2.6vw,24px);margin:0}
.seg{display:inline-flex;background:var(--paper2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sess-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--ink2)}
.sess-meta .bar{flex:1;min-width:140px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--bad)}
.period-h{display:flex;align-items:center;gap:10px;margin:30px 0 12px;padding:10px 16px;background:var(--ink);color:#fff;border-radius:12px;font-family:var(--f-head);font-size:18px}
.period-h small{font-family:var(--f-body);opacity:.75;font-size:13px}
.grp-h{display:inline-block;margin:18px 0 8px;padding:4px 16px;background:var(--gold2);border-radius:8px;font-weight:700}
.kind-h{font-weight:700;color:var(--ink2);margin:14px 0 8px;font-size:15px}
.block{--c:var(--navy);background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.block-h{padding:14px 18px 10px;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
.block-h .tag{flex:none;width:8px;align-self:stretch;border-radius:6px;background:var(--c)}
.block-h h3{font-family:var(--f-body);font-weight:700;font-size:17.5px;margin:0;flex:1}
.block-h .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.note{margin:12px 18px 0;padding:8px 12px;background:var(--warnbg);color:var(--warn);border-radius:10px;font-size:14.5px}
.passage{margin:14px 18px 4px;padding:14px 18px;background:var(--paper);border-inline-start:4px solid var(--gold);border-radius:10px;font-family:var(--f-text);font-size:21px;line-height:2.05}
.poem{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 18px;text-align:center;font-family:var(--f-text);font-size:21px}
.poem .st{color:var(--gold)}
@media (max-width:640px){.poem{grid-template-columns:1fr}.poem .st{display:none}.poem div:nth-child(3n){margin-bottom:10px}}
.items{padding:6px 18px 16px}
.sub{font-weight:700;margin:14px 0 4px;color:var(--ink2)}
.item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;transition:border-color .3s,background .3s}
.item.ok{border-color:#9ED3B2;background:#F6FBF7}
.item.bad{border-color:#F0B4B0;background:#FFF8F7}
.item .q{font-weight:500;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.item .q .qn{flex:none;font-family:var(--f-head);color:var(--navy);min-width:26px}
.item .q u{text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);cursor:pointer;transition:.15s;min-height:46px}
.opt:hover{border-color:var(--navy)}
.opt input{accent-color:var(--navy);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--navy);background:#EEF2FC}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);min-height:46px;transition:border-color .2s}
.inp:focus{border-color:var(--navy);outline:0;box-shadow:0 0 0 3px rgba(13,44,131,.12)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.8}
textarea.essay{min-height:220px}
.inp.ok{border-color:var(--ok)}.inp.bad{border-color:var(--bad)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fields label{font-size:14px;color:var(--ink2);font-weight:600;display:block;margin-bottom:3px}
.words{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--f-text);font-size:22px}
.word{border:1.5px dashed var(--line);border-radius:10px;padding:2px 12px;background:var(--card);cursor:pointer;transition:.15s}
.word.sel{border-style:solid;border-color:var(--navy);box-shadow:inset 0 -4px 0 var(--gold)}
.word.right{border-color:var(--ok);background:var(--okbg)}.word.wrong{border-color:var(--bad);background:var(--badbg)}
.copybox{font-family:var(--f-text);font-size:24px;padding:8px 14px;background:var(--paper);border-radius:10px;margin-bottom:8px;text-align:center}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15.5px;animation:rise .3s}
.fb.ok{background:var(--okbg);color:#14532D}.fb.bad{background:var(--badbg);color:#7F1D1D}.fb.info{background:#EEF2FC;color:var(--navy2)}
.fb b{display:block;margin-bottom:2px}
.fb .ans{font-weight:600}
.fb .ex{opacity:.9;margin-top:4px}
.vflag{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--warn);background:var(--warnbg);border-radius:99px;padding:1px 10px;margin-inline-start:6px;white-space:nowrap}
.wc{font-size:13.5px;color:var(--ink2)}
.model{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.model summary{padding:10px 14px;cursor:pointer;font-weight:700;color:var(--navy)}
.model .mt{padding:0 18px 14px;font-family:var(--f-text);font-size:19.5px;line-height:2;white-space:pre-line}
.model .rules{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.order-pool,.order-line{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border-radius:10px;border:1.5px dashed var(--line)}
.order-line{background:var(--paper);margin-top:8px}
.tok{border:1.5px solid var(--navy);color:var(--navy);background:var(--card);border-radius:99px;padding:4px 14px;font-weight:600}
.tok .k{font-family:var(--f-head);color:var(--gold);margin-inline-end:6px}
.sort-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sort-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cat{border:1.5px solid var(--line);border-radius:12px;padding:8px;min-height:90px;background:var(--paper);transition:.2s}
.cat.target{border-color:var(--gold);background:var(--gold2)}
.cat h4{margin:0 0 6px;font-size:14.5px;font-family:var(--f-head);color:var(--navy)}
.cat .tok{font-size:14px;padding:2px 10px;margin:2px}
.tok.picked{background:var(--navy);color:#fff}
.tok.right{border-color:var(--ok);color:var(--ok);background:var(--okbg)}.tok.wrong{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.blank{display:inline-block;min-width:110px;margin:0 4px}
.blank select{border:1.5px solid var(--navy);border-radius:8px;padding:2px 6px;background:var(--card)}
.blanktxt{line-height:2.4}
.sess-foot{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--paper) 30%);display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
@media (max-width:720px){.sess-foot{position:static;background:none}}
/* ===== results / dashboard ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--paper);border-radius:14px;padding:12px 14px}
.kpi b{font-family:var(--f-head);font-size:30px;display:block;line-height:1.2}
.kpi span{font-size:13.5px;color:var(--ink2)}
.ringwrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.big-ring{position:relative;width:150px;height:150px}
.big-ring svg{transform:rotate(-90deg)}
.big-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head);font-size:34px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:15px}
@media (max-width:560px){.hbar{grid-template-columns:100px 1fr 56px;font-size:14px}}
.hbar .bar{height:12px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:13.5px;color:var(--ink2);font-weight:700}
.tbl-wrap{overflow-x:auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{text-align:center;padding:14px 10px;border-radius:14px;background:var(--paper);border:1px solid var(--line);opacity:.45;filter:grayscale(1);transition:.3s}
.bdg.on{opacity:1;filter:none;background:var(--card);box-shadow:var(--shadow)}
.bdg .em{width:54px;height:54px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold);font-family:var(--f-head);font-size:24px}
.bdg b{display:block;font-size:14.5px}.bdg span{font-size:12.5px;color:var(--ink2)}
/* ===== generator ===== */
.gen{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
@media (max-width:920px){.gen{grid-template-columns:1fr}}
.gsec{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card);overflow:hidden}
.gsec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700}
.gsec>summary::-webkit-details-marker{display:none}
.gsec>summary .caret{transition:.2s;margin-inline-start:auto}
.gsec[open]>summary .caret{transform:rotate(-90deg)}
